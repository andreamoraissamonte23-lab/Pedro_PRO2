                            <p>Ação • Ficção</p>

                            <button class="play"
                                onclick="playGame('Galaxy Battle')">
                                ▶ Jogar
                            </button>
                        </div>

                    </div>


                    <div class="game" data-name="Street Racer"
                         data-category="racing"
                         data-favorite="false">

                        <div class="cover">🏁</div>

                        <div class="game-info">
                            <h3>Street Racer</h3>
                            <p>Corrida • Arcade</p>

                            <button class="play"
                                onclick="playGame('Street Racer')">
                                ▶ Jogar
                            </button>
                        </div>

                    </div>


